[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-case-workbench"
version = "0.1.0"
description = "A portfolio demo for auditable multi-agent AI case intelligence workflows"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "mcp>=2.0",
  "pydantic>=2.0",
  "pypdf>=6.0",
  "uvicorn>=0.30",
  "websockets>=15,<17",
  "python-socks>=2.5,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8"]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
exclude = ["backend.tests", "backend.tests.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
